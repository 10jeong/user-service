spring:
  application:
    name: user-service
  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAPS:43.200.28.227:29092}
    consumer:
      group-id: user-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.yeoljeong.tripmate.*"
        spring.json.type.headers: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.headers: true

    listener:
      ack-mode: manual
      missing-topics-fatal: false

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:tripmate_postgres}
    username: ${DB_USER:tripmate}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

# jwt
jwt:
  secret: ${JWT_SECRET}
#  access-token-expiration: 1800000 # 30분
  access-token-expiration: 2628000000 # 테스트
  refresh-token-expiration: 86400000 # 1일